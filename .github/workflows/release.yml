name: Release & Cross-Platform Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc & musl static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            archive_ext: tar.gz

          # Linux ARM64 (glibc & musl static)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            archive_ext: tar.gz

          # macOS (Apple Silicon & Intel)
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
            archive_ext: tar.gz

          # Windows x86_64 MSVC
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool (cross)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin mca2lod
          else
            cargo build --release --target ${{ matrix.target }} --bin mca2lod
          fi
        shell: bash

      - name: Package artifacts (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.tag_name || 'v1.0.0' }}"
          fi
          
          PKG_NAME="mca2lod-${TAG}-${{ matrix.target }}"
          STAGE_DIR="/tmp/${PKG_NAME}"
          mkdir -p "${STAGE_DIR}"

          cp "target/${{ matrix.target }}/release/mca2lod" "${STAGE_DIR}/"
          cp "README.txt" "${STAGE_DIR}/"
          chmod +x "${STAGE_DIR}/mca2lod"

          tar -czf "${PKG_NAME}.tar.gz" -C "/tmp" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

          echo "ASSET_ARCHIVE=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SHA=${PKG_NAME}.tar.gz.sha256" >> $GITHUB_ENV
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.archive_ext == 'zip'
        run: |
          $TAG = "${{ github.ref_name }}"
          if (-not $TAG -or $TAG -eq "main") {
            $TAG = "${{ inputs.tag_name || 'v1.0.0' }}"
          }
          
          $PKG_NAME = "mca2lod-$TAG-${{ matrix.target }}"
          $STAGE_DIR = "$env:RUNNER_TEMP\$PKG_NAME"
          New-Item -ItemType Directory -Path $STAGE_DIR -Force | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/mca2lod.exe" -Destination "$STAGE_DIR\mca2lod.exe"
          Copy-Item "README.txt" -Destination "$STAGE_DIR\README.txt"

          Compress-Archive -Path "$STAGE_DIR" -DestinationPath "$PKG_NAME.zip" -Force
          $sha = (Get-FileHash -Algorithm SHA256 "$PKG_NAME.zip").Hash.ToLower()
          "$sha  $PKG_NAME.zip" | Out-File -Encoding ascii "$PKG_NAME.zip.sha256"

          echo "ASSET_ARCHIVE=$PKG_NAME.zip" >> $env:GITHUB_ENV
          echo "ASSET_SHA=$PKG_NAME.zip.sha256" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET_ARCHIVE }}
            ${{ env.ASSET_SHA }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          pattern: release-*
          merge-multiple: true

      - name: Display release assets
        run: |
          ls -la release_assets/
          cat release_assets/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: "Release ${{ github.ref_name || inputs.tag_name }}"
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          body: |
            ## Minecraft LOD Engine (${{ github.ref_name || inputs.tag_name }})
            
            High-performance headless Level of Detail (LOD) pre-rendering pipeline for Distant Horizons SQLite and native Voxy RocksDB storage.

            ### Release Binaries & SHA-256 Checksums
            Pre-compiled release packages with embedded `README.txt`:
            
            | Platform | Architecture | Target Triplet | Format |
            | :--- | :--- | :--- | :--- |
            | **Linux** | x86_64 (glibc) | `x86_64-unknown-linux-gnu` | `.tar.gz` |
            | **Linux** | x86_64 (musl static) | `x86_64-unknown-linux-musl` | `.tar.gz` |
            | **Linux** | aarch64 (ARM64) | `aarch64-unknown-linux-gnu` | `.tar.gz` |
            | **Linux** | aarch64 (musl static) | `aarch64-unknown-linux-musl` | `.tar.gz` |
            | **macOS** | Apple Silicon (M1-M4) | `aarch64-apple-darwin` | `.tar.gz` |
            | **macOS** | Intel x86_64 | `x86_64-apple-darwin` | `.tar.gz` |
            | **Windows** | x86_64 MSVC | `x86_64-pc-windows-msvc` | `.zip` |

            ### Quick Usage
            ```bash
            # Linux / macOS:
            ./mca2lod --map /path/to/world.zip --output DistantHorizons.sqlite --radius 64

            # Native Voxy storage for VoxyServer:
            ./mca2lod --format voxy --map /path/to/world --output /path/to/empty/storage --radius 512 --zstd-level 1

            # Windows PowerShell (DH):
            .\mca2lod.exe --map C:\path\to\world --output DistantHorizons.sqlite --radius 64
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
