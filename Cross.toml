# Cross-compilation configuration for RocksDB (librocksdb-sys) C++ dependencies

[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install --assume-yes build-essential clang libclang-dev llvm-dev g++"
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install --assume-yes build-essential clang libclang-dev llvm-dev g++"
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes build-essential clang libclang-dev llvm-dev g++"
]
